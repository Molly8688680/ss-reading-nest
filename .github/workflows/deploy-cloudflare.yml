name: Deploy Reading Nest to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MCP_PATH_TOKEN: ${{ secrets.MCP_PATH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MCP_PATH_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "Missing $key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Ensure D1 database exists and inject its ID
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          existing="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?name=ss-reading-nest-db")"
          db_id="$(printf '%s' "$existing" | jq -r '.result[0].uuid // .result[0].id // empty')"

          if [ -z "$db_id" ]; then
            created="$(curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"ss-reading-nest-db"}'               "$api")"
            db_id="$(printf '%s' "$created" | jq -r '.result.uuid // .result.id // empty')"
          fi

          test -n "$db_id" || { echo "Could not resolve D1 database id"; exit 1; }

          node - "$db_id" <<'NODE'
          const fs = require("fs");
          const id = process.argv[2];
          const path = "server/wrangler.jsonc";
          const source = fs.readFileSync(path, "utf8");
          const updated = source.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID", id);
          fs.writeFileSync(path, updated);
          NODE

      - name: Ensure private R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          cd server
          pnpm exec wrangler r2 bucket create ss-reading-nest-sources >/dev/null 2>&1 || true

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          cd server
          pnpm exec wrangler d1 migrations apply ss-reading-nest-db --remote

      - name: Build
        run: pnpm build

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          cd server
          pnpm exec wrangler deploy

      - name: Store the private MCP path token
        shell: bash
        run: |
          set -euo pipefail
          cd server
          printf '%s' "$MCP_PATH_TOKEN" | pnpm exec wrangler secret put MCP_PATH_TOKEN

      - name: Show connection base URL
        shell: bash
        run: |
          set -euo pipefail
          info="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(printf '%s' "$info" | jq -r '.result.subdomain // empty')"

          {
            echo "## Reading Nest deployed"
            if [ -n "$subdomain" ]; then
              echo
              echo "Base URL: `https://ss-reading-nest.$subdomain.workers.dev`"
              echo
              echo "ChatGPT MCP URL: `https://ss-reading-nest.$subdomain.workers.dev/mcp/<your MCP_PATH_TOKEN>`"
              echo
              echo "iPhone compatibility URL: `https://ss-reading-nest.$subdomain.workers.dev/mcp/<your MCP_PATH_TOKEN>/ios-v4`"
            else
              echo
              echo "Deployment succeeded. Open the Cloudflare Worker named `ss-reading-nest` to copy its workers.dev URL."
            fi
            echo
            echo "The workflow never prints your actual MCP_PATH_TOKEN."
          } >> "$GITHUB_STEP_SUMMARY"
